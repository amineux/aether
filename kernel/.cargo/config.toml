[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
rustflags = [
    "-C", "relocation-model=static",
    "-C", "code-model=small",
    "-C", "link-arg=-T",
    "-C", "link-arg=../boot/x86_64/kernel.ld",
    "-C", "link-arg=-zmax-page-size=0x1000",
    "-C", "link-arg=--no-pie",
]
