[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
rustflags = [
    "-C", "relocation-model=static",
    "-C", "code-model=kernel",
    "-C", "link-arg=-T",
    "-C", "link-arg=../boot/x86_64/kernel.ld",
    "-C", "link-arg=-zmax-page-size=0x1000",
    "-C", "link-arg=--no-pie",
]

[target.riscv64gc-unknown-none-elf]
rustflags = [
    "-C", "relocation-model=static",
    "-C", "code-model=medium",
    "-C", "link-arg=-T",
    "-C", "link-arg=../boot/riscv64/kernel.ld",
    "-C", "link-arg=-zmax-page-size=0x1000",
    "-C", "link-arg=--no-pie",
]

[target.aarch64-unknown-none]
rustflags = [
    "-C", "relocation-model=static",
    "-C", "code-model=small",
    "-C", "link-arg=-T",
    "-C", "link-arg=../boot/aarch64/kernel.ld",
    "-C", "link-arg=-zmax-page-size=0x1000",
    "-C", "link-arg=--no-pie",
]
