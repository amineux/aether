[workspace]
resolver = "2"
members = ["core", "hal", "drivers", "host/aether-pjrt", "examples/diligence-demo", "examples/red-team"]
default-members = ["core", "hal", "drivers", "host/aether-pjrt", "examples/diligence-demo", "examples/red-team"]
exclude = ["kernel", "user/init", "user/probe"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/amineux/aether"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
