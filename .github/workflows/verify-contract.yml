name: Verify evidence contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-tests:
    name: Scoreboard fail-closed regressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p test_verify.py
