name: LeaseLab model

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  model-tests:
    name: LeaseLab analytical model and admission sketch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test_leaselab.mjs
