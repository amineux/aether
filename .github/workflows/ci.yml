# Gate host tests and the QEMU demo on every push / PR.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-qemu:
    name: cargo test + make qemu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install rustup target
        run: rustup target add x86_64-unknown-none

      - name: Install QEMU and binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 binutils gcc

      - name: Host tests
        run: cargo test --workspace

      - name: Diligence demo (host Path B; no QEMU rebuild)
        run: make diligence-demo

      - name: Red-team diligence clip (host stdout)
        run: make red-team

      - name: Design-win worksheet checker
        run: make design-win-check

      # Host leave-behind. Does not rebuild QEMU. Path B stays canonical.
      - name: Partner hello (frozen IreeHalCmd; no QEMU)
        run: make partner-hello-ci

      - name: Soft SMMU bring-up kit (dump/replay scripts)
        run: |
          python3 scripts/smmu_replay.py --check
          python3 scripts/smmu_dump.py --check

      # Path A device model only. Does not rebuild QEMU. Stock make qemu
      # stays path B (in-kernel BAR). See qemu/README.md / QEMU_ACCEL.
      - name: Path-A virtio-accel device model
        run: make accel-test

      - name: QEMU demo (isa-debug-exit success)
        run: make qemu-ci

      - name: QEMU virtio-blk → ramfs (requires -drive)
        run: make qemu-blk-ci

      - name: QEMU PCID request (-cpu +pcid,+invpcid; TCG falls back)
        run: make qemu-pcid-ci

      - name: QEMU PCID fallback (-cpu -pcid)
        run: make qemu-nopcid-ci

      - name: QEMU SMP smoke (-smp 2)
        run: make qemu-smp-ci

  qemu-riscv:
    name: make qemu-riscv-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install rustup target
        run: rustup target add riscv64gc-unknown-none-elf

      - name: Install QEMU (RISC-V)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-misc

      - name: RISC-V virt demo
        run: make qemu-riscv-ci

  qemu-aarch64:
    name: make qemu-aarch64-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install rustup target
        run: rustup target add aarch64-unknown-none

      - name: Install QEMU (aarch64)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm

      - name: aarch64 virt demo
        run: make qemu-aarch64-ci
