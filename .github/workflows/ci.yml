# Gate host tests and the QEMU demo on every push / PR.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-qemu:
    name: cargo test + make qemu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install rustup target
        run: rustup target add x86_64-unknown-none

      - name: Install QEMU and binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 binutils gcc

      - name: Host tests
        run: cargo test --workspace

      - name: QEMU demo (isa-debug-exit success)
        run: make qemu-ci

      - name: QEMU PCID tagged TLB (-cpu +pcid,+invpcid)
        run: make qemu-pcid-ci

      - name: QEMU PCID fallback (-cpu -pcid)
        run: make qemu-nopcid-ci

      - name: QEMU SMP smoke (-smp 2)
        run: make qemu-smp-ci

  qemu-riscv:
    name: make qemu-riscv-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install rustup target
        run: rustup target add riscv64gc-unknown-none-elf

      - name: Install QEMU (RISC-V)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-misc

      - name: RISC-V virt demo
        run: make qemu-riscv-ci

  qemu-aarch64:
    name: make qemu-aarch64-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install rustup target
        run: rustup target add aarch64-unknown-none

      - name: Install QEMU (aarch64)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm

      - name: aarch64 virt demo
        run: make qemu-aarch64-ci
