# Gate host tests and the QEMU demo on every push / PR.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-qemu:
    name: cargo test + make qemu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install rustup target
        run: rustup target add x86_64-unknown-none

      - name: Install QEMU and binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 binutils gcc

      - name: Host tests
        run: cargo test --workspace

      - name: QEMU demo (isa-debug-exit success)
        run: make qemu-ci
